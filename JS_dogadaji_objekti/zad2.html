<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    
    <p id="prikaz"></p>
    <input type="text" name="unos" id="unos">

    <script>
        let prikaz = document.getElementById("prikaz");
        let unos = document.getElementById("unos");

        unos.addEventListener("keydown", function(event) {
            if(event.key === "Enter") { 
                prikaz.textContent = unos.value;
                alert("Potvrđeno");
            }
            else if(event.key === "Escape"){ unos.value = null; }
        } )
    </script>

</body>
</html>
