<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <style>
        .kartica {
            display: grid;
            background-color: salmon;
            font-family: Arial, Helvetica, sans-serif;
            width: 500px;
            height: 700px;
        }
        h1 {
            font-size: 64px;
            color: darkred;
        }
        #unos {
            border-radius: 10px;
            height: 50px;
            width: 125px;
        }

        .btn {
            height: 50px;
            width: 100px;
            border-radius: 10px;
            color: white;
            background-color: black;
        }
    </style>

</head>
<body>
    
     <div class="kartica">
        <h1>TO DO LIST</h1>
        <input type="text" id="unos">
        <button class="btn">ADD ITEM</button>
        <ul class="lista"></ul>
    </div>

    <script>

        let unos = document.querySelector("#unos");
        let addbtn = document.querySelector(".btn");
        let list = document.querySelector(".lista");

        addbtn.addEventListener("click", function(){
            let li = document.createElement("li");
            if(unos.value.trim() !== ""){
                list.appendChild(li);
                li.textContent = unos.value;
            }
        })

    </script>

</body>
</html>
