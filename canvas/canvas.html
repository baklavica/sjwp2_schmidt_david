<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>
  </head>
  <body>
    <canvas
      id="mycanvas"
      width="800"
      height="600"
      style="border: 1px solid #000000"
    ></canvas>
    <script>
      let c = document.getElementById("mycanvas");
      let ctx = c.getContext("2d");

      /* pravokutnik */
      ctx.beginPath();
      ctx.rect(50, 50, 200, 100);
      ctx.fillStyle = "blue";
      ctx.fill();

      /* krug */
      ctx.beginPath();
      ctx.arc(400, 100, 50, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();

      /* linije */
      ctx.beginPath();
      ctx.moveTo(50, 200);
      ctx.lineTo(250, 200);
      ctx.lineTo(150, 300);
      ctx.lineTo(50, 200);
      ctx.strokeStyle = "green";
      ctx.stroke();
    </script>
  </body>
</html>
